  else if(d.delcur){if(confirm("Delete currency "+S.cur[d.delcur].c+"?")){S.cur.splice(d.delcur,1);norm();save();render()}}
  else if(t.id==="addcur"){const c=$("#nc").value.trim().toUpperCase(),r=parseFloat($("#nr").value);if(!/^[A-Z]{3}$/.test(c)||!(r>0))return alert("Enter a 3-letter code and a rate above 0.");if(S.cur.some(x=>x.c===c))return alert(c+" is already added.");S.cur.push({c,r,show:0});save();render();toast(c+" added. Tick it in the list to show it.")}
  else if(d.xi){const[sid,i]=d.xi.split("|"),sc=S.sections.find(x=>x.id===sid),n=sc.items[i];if(S.ui.sc&&S.ui.sc[sid+"|"+n]){d.delc=d.xi;}else if(confirm("Remove \""+n+"\" from "+MON[month]+" "+year+"? Its amount this month is cleared.")){cell(year,sid,n)[month]=0;(S.ui.hide[year+"|"+month]=S.ui.hide[year+"|"+month]||[]).push(sid+"|"+n);save();render();header();return}else return}
  else if(d.xs){const sc=S.sections.find(x=>x.id===d.xs);if(S.ui.sc&&S.ui.sc[sc.id]){d.dels=d.xs}else if(confirm("Remove section \""+sc.name+"\" from "+MON[month]+" "+year+"? Its amounts this month are cleared.")){sc.items.forEach(n=>{cell(year,sc.id,n)[month]=0});(S.ui.hide[year+"|"+month]=S.ui.hide[year+"|"+month]||[]).push(sc.id);save();render();header();return}else return}
  if(d.delc){const[sid,i]=d.delc.split("|"),s=S.sections.find(x=>x.id===sid);if(confirm("Delete \""+s.items[i]+"\" and its amounts?")){const n=s.items.splice(i,1)[0];Object.values(S.data).forEach(y=>{delete y[sid+"|"+n];delete y["c:"+sid+"|"+n]});save();render()}}
  else if(d.dels){const s=S.sections.find(x=>x.id===d.dels);if(confirm("Delete the whole section \""+s.name+"\" and all its amounts?")){S.sections=S.sections.filter(x=>x!==s);Object.values(S.data).forEach(y=>Object.keys(y).forEach(k=>{if(k.startsWith(s.id+"|")||k.startsWith("c:"+s.id+"|"))delete y[k]}));save();render()}}
  else if(t.id==="adds"){const n=$("#sn").value.trim();if(!n)return $("#sn").focus();const nid="s"+Date.now().toString(36);S.sections.push({id:nid,name:n,type:$("#stp").value,items:[]});(S.ui.sc=S.ui.sc||{})[nid]=year+"|"+month;save();render();scrollTo(0,document.body.scrollHeight)}
  else if(t.id==="sw"){[conv.f,conv.t]=[conv.t,conv.f];render()}
  else if(t.id==="ex")download("migastos-backup.json",JSON.stringify(S,null,1),"application/json");
  else if(t.id==="csv"){const L=[["Section","Type","Category",...MON,"Year (USD)"].join(",")];S.sections.forEach(s=>s.items.forEach(n=>{const c=cellU(year,s.id,n);L.push([`"${s.name}"`,s.type,`"${n.replace(/"/g,'""')}"`,...c.map(v=>v.toFixed(2)),c.reduce((a,b)=>a+b,0).toFixed(2)].join(","))}));download("migastos-"+year+".csv",L.join("\n"),"text/csv")}
  else if(t.id==="im")$("#file").click();
  else if(t.id==="addy"){const y=$("#ny").value.trim();if(!/^\d{4}$/.test(y))return alert("Enter a 4-digit year, e.g. 2027.");yd(y);year=y;save();render()}
  else if(t.id==="rs"){if(confirm("Erase everything and start fresh? All amounts go back to 0.00 and the default categories come back.")){S=mk();flipped={};edit=false;conv.a="0.00";norm();save();render();toast("Fresh start · everything is 0.00")}}
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="year"){year=t.value;render()}
  else if(t.id==="dc"){dc=t.value;render()}
  else if(d.s){const s=S.sections.find(x=>x.id===d.s),n=s.items[d.i];cell(year,s.id,n)[month]=parseFloat(t.value)||0;cc(year,s.id,n)[month]=t.closest(".row").querySelector("select").value;save();upd()}
  else if(d.fname){const f=firm(d.fname),v=t.value.trim();if(v){f.name=v;save();render()}else t.value=f.name}
  else if(d.fn){const[fid,eid]=d.fn.split("|"),e=firm(fid).items.find(q=>q.id===eid),v=t.value.trim();if(v){e.name=v;save()}else t.value=e.name}
  else if(d.cs){const[sid,i]=d.cs.split("|"),n=S.sections.find(x=>x.id===sid).items[i];cc(year,sid,n)[month]=t.value;S.ui.def[sid+"|"+n]=t.value;save();upd()}
  else if(d.wl){const[sid,i]=d.wl.split("|"),n=S.sections.find(x=>x.id===sid).items[i];S.link=S.link||{};const k=year+"|"+month+"|"+sid+"|"+n;if(t.value)S.link[k]=t.value;else delete S.link[k];t.style.cssText=wst(t.value);save();header();toast(t.value?"Linked to wallet":"Unlinked")}
  else if(d.cc){const c=S.cards.find(x=>x.id===d.cc);c.cur=t.value;cardUpd(c)}
  else if(d.incl!==undefined){S.ui.incl=t.checked?1:0;save();header()}
  else if(d.show!==undefined){const n=S.cur.filter(x=>x.show).length;if(t.checked&&n>=3){t.checked=false;return toast("You can show up to 3 currencies. Untick one first.")}if(!t.checked&&n<=1){t.checked=true;return toast("Keep at least 1 currency checked.")}S.cur[d.show].show=t.checked?1:0;save();header();const q=$("#curcnt");if(q)q.textContent=S.cur.filter(x=>x.show).length+"/3 shown"}
  else if(d.inclfx!==undefined){S.ui.inclFx=t.checked?1:0;save();header()}
  else if(d.fc){const[fid,eid]=d.fc.split("|");firm(fid).items.find(q=>q.id===eid).cur=t.value;fxUpd()}
  else if(d.rate!==undefined){const v=parseFloat(t.value);if(v>0)S.cur[d.rate].r=v;else t.value=S.cur[d.rate].r;save();header()}
  else if(t.id==="nm"){S.name=t.value.trim();save();header()}
  else if(t.id==="cf"||t.id==="ct"){conv[t.id==="cf"?"f":"t"]=t.value;render()}
  else if(t.id==="file"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.sections||!j.data||!j.cur)throw 0;S=j;norm();save();render()}catch(_){alert("That file isn't a valid MiGastos backup.")}};r.readAsText(t.files[0])}
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(t.id==="ca"){conv.a=t.value;calc()}else if(d.cb){const c=S.cards.find(x=>x.id===d.cb);c.bal=(parseFloat(t.value)||0)-wnet(c.id)*rt(c.cur);cardUpd(c)}else if(d.fb){const[fid,eid]=d.fb.split("|");firm(fid).items.find(q=>q.id===eid).bal=parseFloat(t.value)||0;fxUpd()}else if(t.id==="cq"){const q=t.value.toLowerCase().trim();document.querySelectorAll("#clist .crow").forEach(r=>r.hidden=!!q&&!r.dataset.q.includes(q))}else if(d.th){S.ui.theme[d.th]=t.value;applyTheme();save()}});
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button");if(!b)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height),s=document.createElement("span");s.className="rip";s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
document.addEventListener("focusin",e=>{const t=e.target;if(t.dataset&&t.dataset.z!==undefined&&t.select)setTimeout(()=>{try{t.select()}catch(_){}},0)});

function alignTabs(){document.querySelectorAll(".fc").forEach(f=>{const h=f.querySelector(".fh");if(h)h.style.width=""});
 const hs=[...document.querySelectorAll(".fc > .fh")];if(!hs.length)return;
 const cap=hs[0].parentElement.parentElement.clientWidth||9999,w=Math.min(Math.max(...hs.map(h=>Math.ceil(h.getBoundingClientRect().width))),cap);
 hs.forEach(h=>h.style.width=w+"px")}
{const _r=render;render=function(){_r.apply(this,arguments);alignTabs();requestAnimationFrame(alignTabs)}}

addEventListener("resize",alignTabs);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(alignTabs);

/* v13: equal-width wallet / FX tabs (matches the longest one) */
function alignTabs(){const hs=[...document.querySelectorAll(".fc>.fh")];if(!hs.length)return;hs.forEach(h=>h.style.width="");const box=hs[0].parentElement.parentElement.clientWidth||320,w=Math.min(Math.max(...hs.map(h=>h.offsetWidth)),box-24);hs.forEach(h=>h.style.width=w+"px")}
(()=>{const r0=render;render=function(){r0.apply(this,arguments);alignTabs()};addEventListener("resize",alignTabs);document.fonts&&document.fonts.ready.then(alignTabs);document.addEventListener("input",e=>{if(e.target.matches&&e.target.matches(".fname,[data-cn],[data-fname]"))requestAnimationFrame(alignTabs)});alignTabs()})();
